$kind: http-request
name: Bulk
method: POST
url: '{{base_url}}/api/remote/bulk'
order: 20000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cookies": "{{cookies}}",
      "csrf": "{{csrf}}",
      "authorizedID": "{{authorizedID}}",
      "proxy": "hostel-counselling"
    }
