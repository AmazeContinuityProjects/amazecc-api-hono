$kind: http-request
name: 'Circulars Download'
method: POST
url: '{{base_url}}/api/remote/circulars/download'
order: 18000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cookies": "{{cookies}}",
      "csrf": "{{csrf}}",
      "authorizedID": "{{authorizedID}}"
    }
